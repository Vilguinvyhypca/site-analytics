<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics consent test</title>
<style>
body{font:18px/1.6 system-ui,sans-serif;margin:0;background:#f4f5f7;color:#202633}main{max-width:680px;margin:8vh auto;padding:32px;background:white;border-radius:16px}button,a{font:inherit;margin:8px 8px 8px 0}button{padding:10px 18px;border:1px solid #4c566b;border-radius:8px;cursor:pointer}#allow{background:#244fc0;color:white;border:0}nav{margin-top:24px}output{display:block;padding:16px;background:#edf1f8;border-radius:8px}@media(max-width:720px){main{margin:20px;padding:24px}}
</style>
<main>
<h1>A visit you control</h1>
<p>This local test page sends a page visit only after you allow analytics. You can withdraw permission at any time.</p>
<button id="allow">Allow analytics</button><button id="deny">Decline / withdraw</button>
<output id="state" aria-live="polite">Analytics is off.</output>
<nav><a href="/">Home</a> <a href="/gallery">Gallery</a> <a href="/admin">Excluded page</a></nav>
<p><button id="visit">Record another visit</button><button id="send">Send pending visits</button></p>
<p><button id="counter">Try the page: 0</button></p>
</main>
<script src="/tracker.js"></script>
<script src="/fixture.js"></script>
</html>
